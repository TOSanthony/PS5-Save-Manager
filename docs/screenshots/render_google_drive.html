<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacheteSVG - Google Drive Integration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      background: #060913 radial-gradient(circle at 85% 15%, rgba(68, 102, 242, 0.28) 0%, transparent 55%),
                  radial-gradient(circle at 10% 90%, rgba(118, 214, 255, 0.22) 0%, transparent 45%),
                  linear-gradient(135deg, #060914 0%, #0d132b 50%, #12193b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Dimmed backdrop */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modal Dialog Card */
    .dialog-card {
      width: 860px;
      background: rgba(14, 20, 44, 0.88);
      border: 1.5px solid rgba(118, 214, 255, 0.35);
      box-shadow: 0 24px 64px 0 rgba(0, 0, 0, 0.75), 0 0 40px rgba(118, 214, 255, 0.15);
      border-radius: 24px;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .dialog-header h2 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff;
    }
    .dialog-header p {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.65);
      font-weight: 500;
    }

    .step-label {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .url-box {
      background: rgba(18, 39, 68, 0.85);
      border: 1.5px solid rgba(118, 214, 255, 0.45);
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 26px;
      font-weight: 700;
      color: #76d6ff;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .code-box {
      background: rgba(14, 54, 41, 0.9);
      border: 2px solid rgba(56, 239, 125, 0.7);
      border-radius: 14px;
      padding: 22px 28px;
      font-size: 46px;
      font-weight: 900;
      color: #38ef7d;
      text-align: center;
      letter-spacing: 6px;
      box-shadow: 0 0 30px rgba(56, 239, 125, 0.25);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .waiting-row {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }
    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #76d6ff;
      box-shadow: 0 0 14px #76d6ff;
    }

    .btn-close {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 18px 24px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="modal-overlay">
    <div class="dialog-card">
      <div class="dialog-header">
        <h2>Google Drive Integration</h2>
        <p>Follow these steps on your phone or PC to authorize your console:</p>
      </div>

      <div>
        <div class="step-label">Step 1: Open in phone or browser</div>
        <div class="url-box">https://www.google.com/device</div>
      </div>

      <div>
        <div class="step-label">Step 2: Enter authorization code</div>
        <div class="code-box">WDJB-HGTR</div>
      </div>

      <div class="waiting-row">
        <span class="pulse-dot"></span>
        <span>Waiting for device authorization (RFC 8628)...</span>
      </div>

      <button class="btn-close">Close (✕ / ○)</button>
    </div>
  </div>

</body>
</html>
